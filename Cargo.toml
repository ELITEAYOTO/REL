[workspace]
resolver = "2"
members = ["crates/rel-contracts", "crates/rel-pe", "tools/rel-inspect", "tools/rel-observe", "tools/rel-diff"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
goblin = "=0.10.7"
