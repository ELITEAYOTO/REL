name: REL PE Fuzz Smoke

on:
  pull_request:
    paths:
      - 'crates/rel-pe/**'
      - 'fuzz/**'
      - 'fixtures/pe32-basic.exe'
      - 'fixtures/pe64-basic.exe'
      - 'fixtures/expected.json'
      - 'scripts/test_corpus_cases.py'
      - 'scripts/_internal/corpus_cases.py'
      - 'scripts/_internal/tls_fixture.py'
      - 'scripts/prepare_tls_fuzz_seeds.py'
      - 'scripts/test_tls_fuzz_seeds.py'
      - 'scripts/test_tls_callbacks_oracle.py'
      - 'scripts/_internal/import_fuzz_fixture.py'
      - 'scripts/prepare_import_fuzz_seeds.py'
      - 'scripts/test_import_fuzz_seeds.py'
      - '.github/workflows/fuzz.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pe-libfuzzer:
    name: PE libFuzzer (bounded)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_FUZZ_VERSION: '0.13.2'
      FUZZ_TOOLCHAIN: 'nightly-2026-10-19'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install pinned fuzz nightly (independent of stable workspace)
        run: rustup toolchain install "$FUZZ_TOOLCHAIN" --profile minimal
      - name: Verify locked fuzz graph and record compiler/corpus
        run: |
          rustc +"$FUZZ_TOOLCHAIN" --version --verbose
          cargo +"$FUZZ_TOOLCHAIN" metadata --manifest-path fuzz/Cargo.toml --locked --format-version 1 --no-deps >/dev/null
          sha256sum fuzz/corpus/pe_inspect/*
          printf '%s  %s\n' \
            'f65f21c07542483584cf156f1171ef6d02af1ce7168c573da79f8b81b96cc59e' \
            'fuzz/corpus/pe_inspect/f001-goblin-tls-oob.bin' | sha256sum --check -
      - name: Assert fuzz PE32/PE32+ corpus matches hashed canonical fixtures
        run: python scripts/test_corpus_cases.py
      - name: Verify and generate ignored TLS and import-boundary fuzz seeds
        run: |
          python scripts/test_tls_fuzz_seeds.py
          python scripts/prepare_tls_fuzz_seeds.py --destination fuzz/corpus/pe_inspect
          python scripts/test_import_fuzz_seeds.py
          python scripts/prepare_import_fuzz_seeds.py --destination fuzz/corpus/pe_inspect
      - name: Install pinned cargo-fuzz
        run: cargo +"$FUZZ_TOOLCHAIN" install cargo-fuzz --version "$CARGO_FUZZ_VERSION" --locked
      - name: Record bounded fuzz campaign provenance
        run: |
          {
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "commit=${GITHUB_SHA}"
            echo "target=pe_inspect"
            echo "time_budget_seconds=30;timeout_per_input_seconds=4;rss_limit_mb=1500;max_len=65536;seed=20261018"
            rustc +"$FUZZ_TOOLCHAIN" --version --verbose
            cargo +"$FUZZ_TOOLCHAIN" fuzz --version
            sha256sum fuzz/corpus/pe_inspect/*
          } > rel-fuzz-smoke-metadata.txt
      - name: Build instrumented PE fuzz target
        run: cargo +"$FUZZ_TOOLCHAIN" fuzz build pe_inspect
      - name: Fuzz seeded PE parser for bounded time
        shell: bash
        run: |
          set -o pipefail
          mkdir -p fuzz/artifacts/pe_inspect
          cargo +"$FUZZ_TOOLCHAIN" fuzz run pe_inspect -- -max_total_time=30 -timeout=4 -rss_limit_mb=1500 -max_len=65536 -seed=20261018 -print_final_stats=1 2>&1 | tee rel-fuzz-smoke.log
      - name: Assert fuzz dependency lock remains unchanged
        run: git diff --exit-code -- fuzz/Cargo.lock
      - name: Preserve bounded fuzz logs, provenance and crashing inputs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: rel-pe-fuzz-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            rel-fuzz-smoke-metadata.txt
            rel-fuzz-smoke.log
            fuzz/artifacts/pe_inspect/
          if-no-files-found: warn
