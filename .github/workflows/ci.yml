name: REL CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rust toolchain
        run: rustc --version
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked --workspace --all-targets
      - name: Windows final-component symlink regression (visible)
        if: runner.os == 'Windows'
        run: cargo test --locked -p rel-inspect --bin rel-inspect input::tests::refuses_final_component_symlink_after_preflight_swap -- --nocapture
      - name: Windows parent junction regression (visible)
        if: runner.os == 'Windows'
        run: cargo test --locked -p rel-inspect --bin rel-inspect input::windows_path::tests:: -- --nocapture
      - name: Build
        run: cargo build --locked --release --workspace
      - name: Install pinned process-metric collector
        run: python -m pip install psutil==7.0.0
      - name: Corpus source hashes and overlay reproducibility
        run: python scripts/test_corpus_cases.py
      - name: Measurement context regressions
        run: python scripts/test_measurement_environment.py
      - name: Paired measurement evidence unit regressions
        run: python scripts/test_measurement_evidence.py
      - name: Independent measurement campaign comparison regressions
        run: python scripts/test_measurement_campaigns.py
      - name: JSON Schema validator
        run: python -m pip install 'jsonschema>=4,<5'
      - name: End-to-end CLI test (Windows)
        if: runner.os == 'Windows'
        run: python scripts/smoke_cli.py --binary target/release/rel-inspect.exe
      - name: End-to-end CLI test (Linux)
        if: runner.os == 'Linux'
        run: python scripts/smoke_cli.py --binary target/release/rel-inspect
      - name: Independent Windows PE oracle
        if: runner.os == 'Windows'
        run: |
          python -m pip install pefile==2024.8.26
          python scripts/check_windows_pe_oracle.py --binary target/release/rel-inspect.exe
      - name: Build controlled MSVC and Clang-cl x64 PE references (Windows; do not execute)
        if: runner.os == 'Windows'
        shell: cmd
        run: call scripts\build_windows_msvc_probe.cmd
      - name: Independent MSVC PE structure oracle (Windows)
        if: runner.os == 'Windows'
        run: python scripts/check_windows_msvc_probe.py --binary target/release/rel-inspect.exe --probe compiler-probes/rel-msvc-probe.exe
      - name: Independent Clang-cl PE structure oracle (Windows)
        if: runner.os == 'Windows'
        run: python scripts/check_windows_msvc_probe.py --binary target/release/rel-inspect.exe --probe compiler-probes/rel-clang-cl-probe.exe --compiler-label Clang-cl
      - name: Independent structured MSVC PE resource/relocation oracle
        if: runner.os == 'Windows'
        run: python scripts/check_windows_structured_probe.py --binary target/release/rel-inspect.exe --probe compiler-probes/rel-msvc-structured.exe --compiler-label MSVC
      - name: Independent structured Clang-cl PE resource/relocation oracle
        if: runner.os == 'Windows'
        run: python scripts/check_windows_structured_probe.py --binary target/release/rel-inspect.exe --probe compiler-probes/rel-clang-structured.exe --compiler-label Clang-cl
      - name: Benchmark CLI (Windows)
        if: runner.os == 'Windows'
        run: python scripts/benchmark_cli.py --binary target/release/rel-inspect.exe --samples 5 --warmup 1 --windows-msvc-probe compiler-probes/rel-msvc-probe.exe --windows-clang-probe compiler-probes/rel-clang-cl-probe.exe --windows-msvc-structured compiler-probes/rel-msvc-structured.exe --windows-clang-structured compiler-probes/rel-clang-structured.exe --output rel-benchmark.json
      - name: Benchmark CLI (Linux)
        if: runner.os == 'Linux'
        run: python scripts/benchmark_cli.py --binary target/release/rel-inspect --samples 5 --warmup 1 --output rel-benchmark.json
      - name: Bounded watchdog regressions (Windows)
        if: runner.os == 'Windows'
        run: python scripts/test_bounded_inspection.py --binary target/release/rel-inspect.exe
      - name: Bounded watchdog regressions (Linux)
        if: runner.os == 'Linux'
        run: python scripts/test_bounded_inspection.py --binary target/release/rel-inspect
      - name: Profile PE memory and CPU (Windows)
        if: runner.os == 'Windows'
        run: python scripts/profile_resources.py --binary target/release/rel-inspect.exe --samples 5 --warmup 1 --windows-msvc-probe compiler-probes/rel-msvc-probe.exe --windows-clang-probe compiler-probes/rel-clang-cl-probe.exe --windows-msvc-structured compiler-probes/rel-msvc-structured.exe --windows-clang-structured compiler-probes/rel-clang-structured.exe --output rel-resources.json
      - name: Profile PE memory and CPU (Linux)
        if: runner.os == 'Linux'
        run: python scripts/profile_resources.py --binary target/release/rel-inspect --samples 5 --warmup 1 --output rel-resources.json
      - name: Validate paired measurement integrity and sampling coverage (Windows)
        if: runner.os == 'Windows'
        run: python scripts/check_measurement_evidence.py --benchmark rel-benchmark.json --resources rel-resources.json --expected-cases 11 --output rel-measurement-evidence.json
      - name: Validate paired measurement integrity and sampling coverage (Linux)
        if: runner.os == 'Linux'
        run: python scripts/check_measurement_evidence.py --benchmark rel-benchmark.json --resources rel-resources.json --expected-cases 6 --output rel-measurement-evidence.json
      - name: Upload paired measurement evidence
        uses: actions/upload-artifact@v4
        with:
          name: rel-measurement-evidence-${{ matrix.os }}
          path: rel-measurement-evidence.json
          if-no-files-found: error
      - name: Upload resource observations
        uses: actions/upload-artifact@v4
        with:
          name: rel-resource-profile-${{ matrix.os }}
          path: rel-resources.json
          if-no-files-found: error
      - name: Upload benchmark observations
        uses: actions/upload-artifact@v4
        with:
          name: rel-cli-benchmark-${{ matrix.os }}
          path: rel-benchmark.json
          if-no-files-found: error
